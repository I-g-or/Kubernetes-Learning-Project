replicaCount: 1

backendName: backend

image:
  repository: abdennour/go-to-do-api
  tag: rc
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  containerPort: 8080

existingSecret:
  name: db-secret
  dbNameKey: DB_NAME
  dbConnectionKey: DB_CONNECTION

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

readinessProbe:
  path: /healthz
  port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  path: /healthz
  port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3