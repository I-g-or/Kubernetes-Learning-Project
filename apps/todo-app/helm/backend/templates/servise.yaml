apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backendName }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    {{- include "backend.selectorLabels" . | nindent 4 }}