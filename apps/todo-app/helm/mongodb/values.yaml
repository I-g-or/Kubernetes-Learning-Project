architecture: replicaset
replicaCount: 3    # Primary + 2 Secondary
replicaSetName: rs0

auth:
  enabled: true
  rootUser: root
  rootPassword: "todoapp"
  usernames:
    - todoapp
  passwords:
    - todoapp
  databases:
    - todoapp
  replicaSetKey: "ReplicaSetKey123!"

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 2Gi

podAntiAffinityPreset: soft

pdb:
  create: true
  maxUnavailable: 1

persistence:
  enabled: true
  storageClass: "local-path"
  size: 5Gi
  accessModes:
    - ReadWriteOnce

service:
  nameOverride: mongodb
  ports:
    mongodb: 27017

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
