apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontendName }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP

  selector:
    {{- include "frontend.selectorLabels" . | nindent 4 }}