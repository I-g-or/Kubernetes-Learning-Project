replicaCount: 1

frontendName: frontend

image:
  repository: abdennour/go-to-do-frontend
  tag: rc
  pullPolicy: IfNotPresent

initContainer:
  image:
    repository: abdennour/dotenv-to-js-object
    tag: 4ea
    pullPolicy: IfNotPresent
  args:
    - --dest=/data
    - --env-vars-filter=REACT_APP_
    - --run-as=job
  volumeMountPath: /data

service:
  type: ClusterIP
  port: 8080
  containerPort: 8080

volume:
  name: data-env
  mountPath: /opt/app/config

env:
  REACT_APP_API_ENDPOINT: "https://igor1.pp.ua"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

readinessProbe:
  path: /
  port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  path: /
  port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3