---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: todo-app
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: todo-app
    app.kubernetes.io/component: database
type: Opaque
stringData:
  DB_NAME: todoapp
  DB_PASSWORD: todoapp
  DB_DATABASE: todolist
  DB_CONNECTION: "mongodb://todoapp:todoapp@mongodb:27017/todolist"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: todo-app
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: todo-app
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: todo-app
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: todo-app
    app.kubernetes.io/component: database
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: todo-app
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_NAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_DATABASE
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command:
                - mongosh
                - --username
                - todoapp
                - --password
                - todoapp
                - --authenticationDatabase
                - admin
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mongosh
                - --username
                - todoapp
                - --password
                - todoapp
                - --authenticationDatabase
                - admin
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-pvc
        - name: init-scripts
          configMap:
            name: mongodb-init

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: todo-app
data:
  init-user.js: |
    db = db.getSiblingDB('todolist');
    db.createUser({
      user: 'todoapp',
      pwd: 'todoapp',
      roles: [{ role: 'readWrite', db: 'todolist' }]
    });

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: todo-app
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: todo-app
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
