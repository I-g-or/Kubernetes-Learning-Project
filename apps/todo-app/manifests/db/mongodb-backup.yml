---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-backup
  namespace: todo-app
  labels:
    app.kubernetes.io/name: mongodb-backup
    app.kubernetes.io/part-of: todo-app
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: todo-app
  labels:
    app.kubernetes.io/name: mongodb-backup
    app.kubernetes.io/part-of: todo-app
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 43200

      template:
        metadata:
          labels:
            app.kubernetes.io/name: mongodb-backup
            app.kubernetes.io/part-of: todo-app
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mongodb-backup
              image: mongo:6.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_DIR="/backup"
                  BACKUP_FILE="${BACKUP_DIR}/mongodb-backup-${TIMESTAMP}.archive.gz"

                  echo "=== MongoDB backup started at ${TIMESTAMP} ==="
                  echo "Target: ${BACKUP_FILE}"

                  # mongodump:
                  #   --uri          — строка подключения (из Secret)
                  #   --archive      — пишем в один файл вместо папки
                  #   --gzip         — сжимаем
                  mongodump \
                    --uri="${DB_CONNECTION}" \
                    --archive="${BACKUP_FILE}" \
                    --gzip

                  echo "Backup finished successfully"
                  ls -lh "${BACKUP_DIR}"

                  # === Delete backups older than 7 days ===
                  find "${BACKUP_DIR}" -name "mongodb-backup-*.archive.gz" -mtime +7 -delete || true
                  echo "Old backups cleaned (older than 7 days)"
                  ls -lh "${BACKUP_DIR}" || true

              env:
                - name: DB_CONNECTION
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: DB_CONNECTION

              volumeMounts:
                - name: backup-storage
                  mountPath: /backup

              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"

          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: mongodb-backup
