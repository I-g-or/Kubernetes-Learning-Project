---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: todo-backend-internal
  namespace: monitoring
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/component: probe
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://backend.todo-app.svc.cluster.local:8080/healthz
      labels:
        app: todo-app
        component: backend
        check: internal

---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: todo-frontend-internal
  namespace: monitoring
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/component: probe
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://frontend.todo-app.svc.cluster.local:8080/
      labels:
        app: todo-app
        component: frontend
        check: internal